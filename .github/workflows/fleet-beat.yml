name: fleet-beat

# fleet-beat — the sovereign executor's consolidated carrier (free public minutes).
# Why this repo is PUBLIC: Actions minutes are unlimited-free for public repos; private
# repos hit the org spending wall. Smart separation: private CONTENT stays private —
# this plane executes read-only tasks over the fleet via the encrypted SOVEREIGN_PAT
# secret and publishes pseudonymous receipts only.
# SECRET-SURFACE LAW: schedule + workflow_dispatch ONLY. No pull_request trigger may
# ever be added (a fork PR could otherwise reach the secret). Every addition to
# .github/workflows/ must keep this law — reviewers enforce, the beat re-reads.
# SCHEDULE-DENSITY LAW (wave-19.4, measured): GitHub DROPS scheduled events under load —
# measured today: 1 fired slot out of 7 since repo creation, then 6/6 on */15.
# CONTINUITY LAW (wave-19.6, measured): 17 of 18 scheduled slots dropped across three
# repos in one afternoon — cron is NOT sovereign continuity. The beat now perpetuates
# ITSELF: every successful beat dispatches its next link (scripts/chain_link.py) and the
# interval gate (scripts/interval_gate.py) is the metronome — a fresh slot SLEEPS TO DUE
# instead of exiting. Schedule + the cross-repo keep-alive net (runner-kit, beacon)
# remain as independent backup trigger planes. Deterministic upgrade path stays the
# owner's self-hosted runner (zero minutes, zero drops) — see
# sovereign-runner-kit/scripts/sovereign-runner-register.sh.

on:
  schedule:
    - cron: '*/15 * * * *'   # x4 density — GitHub drops scheduled events under load (measured 1/7 today); the interval gate keeps slots lean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-beat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # the metronome: a fresh slot sleeps up to ~55min to due, then beats
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Interval gate (the metronome — sleep to due; another plane beating meanwhile = honest skip)
        id: gate
        run: python3 scripts/interval_gate.py

      - name: Bun 1.3.14 (the book's home version — economy-book task needs the engine's runtime)
        if: steps.gate.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Law self-test (leak-law + task-registry drift prove themselves every beat)
        if: steps.gate.outputs.run == 'true'
        env:
          SOVEREIGN_PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: python3 scripts/beat.py --self-test

      - name: Beat (read-only fleet tasks + the owner-approved write-path economy-book task)
        if: steps.gate.outputs.run == 'true'
        env:
          SOVEREIGN_PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: python3 scripts/beat.py

      - name: Publish receipts only if changed (commit + rebase-retry push) — evidence lands even on red
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "fleet-beat[bot]"
          git config user.email "fleet-beat[bot]@users.noreply.github.com"
          git add receipts/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "fleet-beat receipts unchanged — nothing to publish"
            exit 0
          fi
          git commit -m "fleet-beat: receipts $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs --autostash origin main && git push origin HEAD:main; then exit 0; fi
            echo "push race, retry ${i}"; sleep 8
          done
          echo "could not publish fleet-beat receipts after 3 attempts"
          exit 1

      - name: Evaluate (honest red if any task failed)
        if: steps.gate.outputs.run == 'true'
        run: |
          FAILED=$(python3 -c "import json; print(json.load(open('receipts/fleet-beat/last.json'))['failed'])")
          echo "tasks failed: $FAILED"
          test "$FAILED" = "0"

      - name: Chain (the beat perpetuates itself — scheduler-independent continuity; chains only after success)
        if: success() && steps.gate.outputs.run == 'true'
        env:
          SOVEREIGN_PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: python3 scripts/chain_link.py
